name: Integration and deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Creating SSH key files.
        run: |
          mkdir -p ~/.ssh/
          echo "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/github_ed25519
          sudo chmod 600 ~/.ssh/github_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Cloning sources.
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            cd ~/src
            rm -rf ${{ github.repository }}
            git clone ssh://git@github.com/${{ github.repository }}.git
          EOF
      - name: Redis cache for refresh tokens.
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            set -e
            if [ "$(docker ps -aq -f name=^redis-refresh-tokens$)" ]; then
              docker start redis-refresh-tokens
            else
              docker run -d \
                --name redis-refresh-tokens \
                --network ${{ secrets.DOCKER_NETWORK }} \
                --restart unless-stopped \
                --memory="64m" \
                --cpus="0.25" \
                -v rsdata:/data \
                redis:7.4.12-alpine3.21 \
                redis-server \
                  --appendonly yes \
                  --no-appendfsync-on-rewrite yes \
                  --requirepass \${REDIS_PASSWORD} \
                  --maxmemory 48mb \
                  --maxmemory-policy allkeys-lru
            fi
          EOF
      - name: Create kafka topic auth-error.
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            set -e
            docker exec kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka:8000 \
              --create \
              --if-not-exists \
              --topic auth-error \
              --partitions 1 \
              --replication-factor 1
          EOF
      - name: Migrate up.
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            set -e
            cd ~/src/${{ github.event.repository.name }}
            docker run --rm \
              --network=${{ secrets.DOCKER_NETWORK }} \
              --name migration \
              --volume ${{ secrets.HOME }}/src/${{ github.event.repository.name }}/schema:/migrations \
              migrate/migrate \
                -path /migrations \
                -database 'postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD_URL_ENCODE }}@${{ secrets.POSTGRES_HOST }}:5432/${{ github.event.repository.name }}?sslmode=disable&password=' \
                up
          EOF
      - name: Testing.
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            set -e
            cd ~/src/${{ github.event.repository.name }}
            docker buildx rm ${{ secrets.DOCKER_NETWORK }}-builder || true
            docker buildx create --use \
              --name ${{ secrets.DOCKER_NETWORK }}-builder \
              --driver docker-container \
              --driver-opt "network=${{ secrets.DOCKER_NETWORK }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD_URL_ENCODE }}"
            export ACCESS_KEY="${{ secrets.ACCESS_KEY }}"
            export REFRESH_KEY="${{ secrets.REFRESH_KEY }}"
            docker buildx build \
              --network=host \
              --target=testing \
              --output=type=docker \
              --build-arg NAME=${{ github.event.repository.name }} \
              --secret id=postgres_password,env=POSTGRES_PASSWORD \
              --secret id=access_key,env=ACCESS_KEY \
              --secret id=refresh_key,env=REFRESH_KEY \
              --no-cache \
              --tag ${{ github.repository }}:testing .
          EOF
      - name: Building.
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            set -e
            cd ~/src/${{ github.event.repository.name }}
            docker build \
             --build-arg NAME=${{ github.event.repository.name }} \
             --no-cache \
             --tag ${{ github.repository }}-v${{ vars.MAJOR_VERSION }} .
            docker push ${{ github.repository }}-v${{ vars.MAJOR_VERSION }}
          EOF
      - name: Remove sources.
        if: success() || failure()
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            docker rmi ${{ github.repository }}:testing || true
            docker buildx rm ${{ secrets.DOCKER_NETWORK }}-builder || true
            rm -rf ~/src/${{ github.event.repository.name }} || true
          EOF
      - name: Remove ssh key files.
        if: success() || failure()
        run: |
          rm -f ~/.ssh/github_ed25519
          rm -f ~/.ssh/known_hosts
  deploy:
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - name: Creating SSH key files.
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_ed25519
          sudo chmod 600 ~/.ssh/github_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Creating and running application container.
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            set -e
            docker stop ${{ github.event.repository.name }}-v${{ vars.MAJOR_VERSION }} || true
            docker rm ${{ github.event.repository.name }}-v${{ vars.MAJOR_VERSION }} || true
            docker pull ${{ github.repository }}-v${{ vars.MAJOR_VERSION }}
            docker run -d \
              --network ${{ secrets.DOCKER_NETWORK }} \
              --name ${{ github.event.repository.name }}-v${{ vars.MAJOR_VERSION }} \
              --memory="32m" \
              --cpus="0.25" \
              --env POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_URL_ENCODE }} \
              --env ACCESS_KEY=${{ secrets.ACCESS_KEY }} \
              --env REFRESH_KEY=${{ secrets.REFRESH_KEY }} \
              --volume ${{ secrets.HOME }}/logs/${{ github.event.repository.name }}:/var/log/${{ github.event.repository.name }} \
              --restart unless-stopped \
              --stop-timeout -1 \
              ${{ github.repository }}-v${{ vars.MAJOR_VERSION }}
          EOF
      - name: Creating and running documentation container.
        run: |
          ssh -i ~/.ssh/github_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            set -e
            docker stop ${{ github.event.repository.name }}-v${{ vars.MAJOR_VERSION }}-doc || true
            docker rm ${{ github.event.repository.name }}-v${{ vars.MAJOR_VERSION }}-doc || true
            docker run -d \
              --name ${{ github.event.repository.name }}-v${{ vars.MAJOR_VERSION }}-doc \
              --network ${{ secrets.DOCKER_NETWORK }} \
              --memory="48m" \
              --cpus="0.25" \
              --restart unless-stopped \
              --env SWAGGER_JSON_URL=https://secret.skvdmt.ru/api/auth/v${{ vars.MAJOR_VERSION }}/openapi.yaml \
              docker.swagger.io/swaggerapi/swagger-ui
          EOF
      - name: Remove SSH key files.
        if: success() || failure()
        run: |
          rm -f ~/.ssh/github_ed25519
          rm -f ~/.ssh/known_hosts
